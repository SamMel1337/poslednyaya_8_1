name: CI/CD for Medical Diagnostics

on:
  push:
     branches: [ main, develop, dgango ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_pass
          POSTGRES_DB: medical_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install dj-database-url

    - name: Start Django server and test
      run: |
        python manage.py runserver 127.0.0.1:8000 &

    - name: Create .env file
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci-cd" > .env
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,testserver" >> .env
        echo "DATABASE_URL=sqlite:///db.sqlite3" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend" >> .env


    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput

    - name: Run tests
      run: python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            git pull origin dgango                   
            docker-compose down
            docker-compose up -d --build
            echo "Application deployed successfully!"